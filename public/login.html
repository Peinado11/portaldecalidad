<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Portal de Entrenamiento</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card fade-in">
            <div class="login-header">
                <h1 class="login-title">Portal de Entrenamiento</h1>
                <p class="login-subtitle">Sistema de Onboarding para Nuevos Empleados</p>
            </div>

            <div id="alert-container"></div>

            <form id="login-form">
                <div class="form-group">
                    <label class="form-label" for="usuario">Usuario</label>
                    <input
                        type="text"
                        id="usuario"
                        class="form-input"
                        placeholder="Ingresa tu usuario o correo"
                        required
                        autocomplete="username"
                    >
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Contraseña</label>
                    <input
                        type="password"
                        id="password"
                        class="form-input"
                        placeholder="Ingresa tu contraseña"
                        required
                        autocomplete="current-password"
                    >
                </div>

                <button type="submit" class="btn btn-primary btn-block" id="login-btn">
                    <span id="login-text">Iniciar Sesión</span>
                    <span id="login-loading" class="loading hidden"></span>
                </button>
            </form>

            <div class="text-center mt-4">
                <p style="font-size: 12px; color: var(--text-secondary);">
                    Para soporte técnico, contacta a RH
                </p>
            </div>
        </div>
    </div>

    <script src="/js/login.js"></script>
</body>
</html>
